<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="sign-in.css">
    <link rel="stylesheet" href="base.css">
</head>

<body>
    <div class="container">
        <div class="top-bar">
            <button onclick="location.href='login.html'">로그인</button>
        </div>
        <h2>회원가입</h2>
        <hr /><br />

        <form id="signup-form">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required />

            <label for="studentId">학번</label>
            <input type="text" id="studentId" name="studentId" placeholder="예: 22200000" required />

            <label for="department">학부</label>
            <select id="department" name="department" required>
                <option value="" disabled selected>== 학부 선택 ==</option>
                <option value="eng">전산전자학부</option>
                <option value="bus">콘텐츠융합디자인학부</option>
                <option value="sci">커뮤니케이션학부</option>
                <option value="art">ICT창업학부</option>
                <option value="sci">글로벌리더십학부</option>
                <option value="sci">생명과학부</option>
                <option value="sci">기계제어공학부</option>
                <option value="sci">경영경제학부</option>
                <option value="sci">법학부</option>
                <option value="sci">국제어문학부</option>
                <option value="sci">공간환경시스템학부</option>
                <option value="sci">상담심리사회복지학부</option>
            </select>

            <label>이메일</label>
            <div class="email-group">
                <input type="text" id="emailLocal" placeholder="이메일을 입력하세요" required />
                <span>@</span>
                <select id="emailDomainSelect" class="email-domain-select" required>
                    <option value="" disabled selected>선택</option>
                    <option value="gmail.com">gmail.com</option>
                    <option value="handong.ac.kr">handong.ac.kr</option>
                    <option value="naver.com">naver.com</option>
                    <option value="custom">직접 입력</option>
                </select>
                <input type="text" id="emailDomainCustom" class="email-domain-custom" placeholder="example.com" />
                <input type="hidden" id="emailFull" name="email" />
            </div>

            <hr class="divider email-divider" />

            <label for="username">아이디</label>
            <input type="text" id="username" name="username" placeholder="새로운 아이디를 입력하세요" required />

            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="7자 이상 비밀번호를 입력하세요" required />

            <label for="passwordConfirm">비밀번호 확인</label>
            <input type="password" id="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required />

            <hr class="divider pw-divider" />

            <label for="phone">전화번호 (선택)</label>
            <input type="text" id="phone" name="phone" placeholder="예: 010-1234-5678" />

            <div class="checkbox">
                <input type="checkbox" id="agree" required />
                <label for="agree" style="margin:0">이용약관 및 개인정보 처리방침에 동의합니다.</label>
            </div>

            <div class="actions">
                <input type="submit" value="가입하기" />
                <input type="reset" value="초기화" />
            </div>
        </form>
    </div>

    <script>
        const domainSelect = document.getElementById('emailDomainSelect');
        const customDomainInput = document.getElementById('emailDomainCustom');
        const emailFull = document.getElementById('emailFull');
        const emailLocal = document.getElementById('emailLocal');

        domainSelect.addEventListener('change', () => {
            if (domainSelect.value === 'custom') {
                customDomainInput.style.display = 'block';
                customDomainInput.required = true;
            } else {
                customDomainInput.style.display = 'none';
                customDomainInput.required = false;
            }
        });


        document.getElementById('signup-form').addEventListener('submit', function (e) {
            e.preventDefault();

            if (password.value !== passwordConfirm.value) {
                alert('비밀번호가 일치하지 않습니다!');
                passwordConfirm.focus();
                return;
            }

            const domain = domainSelect.value === 'custom' ? customDomainInput.value.trim() : domainSelect.value;
            if (!domain) {
                alert('이메일 도메인을 선택하거나 입력해주세요.');
                return;
            }

            emailFull.value = `${emailLocal.value.trim()}@${domain}`;

            const formData = new FormData(this);
            const newUser = Object.fromEntries(formData);
            newUser.id = Date.now(); // 내부 고유 ID도 부여 가능

            // 기존 사용자 목록 불러오기
            const userList = JSON.parse(localStorage.getItem('userList') || '[]');

            // 아이디 중복 체크
            if (userList.find(u => u.username === newUser.username)) {
                alert('이미 존재하는 아이디입니다.');
                return;
            }

            userList.push(newUser);
            localStorage.setItem('userList', JSON.stringify(userList));

            alert('회원가입이 완료되었습니다!');
            window.location.href = 'login.html';
        });
    </script>
</body>

</html>
