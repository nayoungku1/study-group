    }
    .content {
      padding-top: 0px !important;   /* 너무 큰 기본 padding 제거 */
    }

  </style>
</head>

<body>
  <div>

  </div>


  <div class="navbar">
    <div style="display: flex; flex-direction: column;">
      <a class="logo" href="main.html"><img class="logo" src="logo/Studium logo4.png"></a>
    </div>
    <div>
      <ul class="nav-link">
        <li><a href="index.html">About</a></li>
        <li><a href="main.html">스터디 찾기</a></li>
        <li><a href="newStudy.html">스터디 등록</a></li>
        <li><a href="acceptdecline.html">스터디 관리</a></li>
        <li><a href="mypage.html">마이페이지</a></li>
        <!--<li ><a href="acceptdecline.html">신청 수락/거절</a></li>-->
      </ul>
    </div>
    <div class="right">
      <button class="bell-icon" id="notification-btn">🔔<span id="notification-badge"></span></button>
      <div id="auth-button-container"></div>
    </div>
  </div>
  <div class="main">
    <div class="search-wrapper">
      <input type="text" class="category-search" placeholder="스터디를 검색해보세요 🔍" />
    </div>
    <div class="category-bar">
      <botton class="category-item active">전체</botton>
      <botton class="category-item">개발</botton>
      <botton class="category-item">디자인</botton>
      <botton class="category-item">외국어</botton>
      <botton class="category-item">취업준비</botton>
      <botton class="category-item">자격증</botton>
      <botton class="category-item">공모전</botton>
      <botton class="category-item">기타</botton>
    </div>
    <div class="content">
      <div id="study-gallery" class="study-gallery" style="display: flex; flex-wrap: wrap; gap: 20px;"></div>
    </div>
  </div>
  </div>
  </div>

  <div id="notification-modal">
    <div>알림</div>
    <div>스터디원 요청이 도착했습니다.</div>
    <button id="accept-btn">수락</button>
    <button id="reject-btn">거절</button>
  </div>

  <script>
    // 페이지 로드 시 새 알림이 있다고 가정(뱃지 표시)
    document.getElementById('notification-badge').style.display = 'inline-block';

    document.getElementById('notification-btn').onclick = function () {
      document.getElementById('notification-modal').innerHTML = `
        <div>알림</div>
        <div>스터디원 요청이 도착했습니다.</div>
        <button id="accept-btn">수락</button>
        <button id="reject-btn">거절</button>
      `;
      document.getElementById('notification-modal').style.display = 'block';
      // 알림 확인시 뱃지 숨김
      document.getElementById('notification-badge').style.display = 'none';

      document.getElementById('accept-btn').onclick = function () {
        document.getElementById('notification-modal').innerHTML = `
          <div>스터디원 요청을 <b style="color:green;">수락</b>했습니다!</div>
          <button id="close-btn">닫기</button>
        `;
        document.getElementById('close-btn').onclick = function () {
          document.getElementById('notification-modal').style.display = 'none';
        }
      }
      document.getElementById('reject-btn').onclick = function () {
        document.getElementById('notification-modal').innerHTML = `
          <div>스터디원 요청을 <b style="color:red;">거절</b>했습니다.</div>
          <button id="close-btn">닫기</button>
        `;
        document.getElementById('close-btn').onclick = function () {
          document.getElementById('notification-modal').style.display = 'none';
        }
      }
    };

    window.addEventListener('mousedown', function (e) {
      let modal = document.getElementById('notification-modal');
      let btn = document.getElementById('notification-btn');
      if (modal.style.display === "block" && !modal.contains(e.target) && e.target !== btn) {
        modal.style.display = "none";
      }
    });
  </script>

  <script>
    const categoryItems = document.querySelectorAll('.category-item');

    categoryItems.forEach(item => {
      item.addEventListener('click', () => {
        // 기존 선택된 항목에서 active 제거
        categoryItems.forEach(i => i.classList.remove('active'));
        // 클릭된 항목에 active 추가
        item.classList.add('active');
      });
    });
  </script>

  <script>
    const sidebar = document.querySelector('.sidebar');
    const toggleBtn = document.getElementById('sidebar-toggle');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('active');
    });

    // 선택사항: 바깥 클릭 시 sidebar 닫기
    window.addEventListener('click', (e) => {
      if (!sidebar.contains(e.target) && e.target !== toggleBtn) {
        sidebar.classList.remove('active');
      }
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const studyList = JSON.parse(localStorage.getItem("studyList") || "[]");
      const gallery = document.getElementById("study-gallery");

      studyList.forEach(study => {
        const timeText = Array.isArray(study.time) ? study.time.join(" · ") : study.time;
        const tags = study.keywords ? study.keywords.split(",").map(tag => `<span class="study-tag">${tag.trim()}</span>`).join("") : "";

        const card = document.createElement("div");
        card.className = "study-card";

        card.innerHTML = `
        <div class="study-card-header">${study.groupname}</div>

        <div class="study-card-body">
          <div>${study.summary || "스터디 소개 없음"}</div>
          <!-- study-card-body 안 -->
          <div class="study-save" onclick="toggleBookmark(${study.id}, this)">♡</div>

        </div>

        <div class="study-card-footer">
          <div class="study-info">
            📅 ${timeText} <span class="divider">|</span> 👥 1/${study["max-people"]} 명 <span class="divider">|</span> 🙌 ${study["mode"]}
          </div>
          <div class="study-tag-list">${tags}</div>
        </div>
      `;

        card.onclick = () => {
          window.location.href = `details.html?id=${study.id}`;
        };

        gallery.appendChild(card);
      });
    });
  </script>

</body>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const currentUser = localStorage.getItem("currentUser");
    const authContainer = document.getElementById("auth-button-container");

    if (currentUser) {
      // ✅ 로그인된 경우: 로그아웃 버튼 생성
      const logoutBtn = document.createElement("button");
      logoutBtn.className = "login-btn";
      logoutBtn.textContent = "로그아웃";
      logoutBtn.onclick = function () {
        localStorage.removeItem("currentUser");
        alert("로그아웃 되었습니다.");
        location.reload(); // 새로고침으로 UI 갱신
      };
      authContainer.appendChild(logoutBtn);
    } else {
      // ✅ 비로그인 상태: 로그인/회원가입 링크
      const loginLink = document.createElement("a");
      loginLink.href = "login.html";

      const loginBtn = document.createElement("button");
      loginBtn.className = "login-btn";
      loginBtn.textContent = "로그인/회원가입";

      loginLink.appendChild(loginBtn);
      authContainer.appendChild(loginLink);
    }
  });

  function toggleBookmark(studyId, element) {
  const currentUser = localStorage.getItem("currentUser");
  if (!currentUser) {
    alert("로그인이 필요합니다!");
    return;
  }

  const key = `user_bookmarks_${currentUser}`;
  let bookmarks = JSON.parse(localStorage.getItem(key) || "[]");

  if (bookmarks.includes(studyId)) {
    bookmarks = bookmarks.filter(id => id !== studyId);
    element.textContent = "♡";
    element.classList.remove("active");
  } else {
    bookmarks.push(studyId);
    element.textContent = "♥";
    element.classList.add("active");
  }

  localStorage.setItem(key, JSON.stringify(bookmarks));
}

</script>


</html>
