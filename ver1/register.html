<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 스터디 그룹 등록</title>
    <style>
        body {
            font-family: 'Arial', 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: left;
            color: #333;
        }

        .profile-section {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .profile-photo {
            width: 200px;
            height: 200px;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 2px solid #ddd;
        }

        .upload-option {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .upload-option:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .profile-details {
            flex-grow: 1;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .keyword-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }

        .keyword {
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
        }

        .keyword span {
            margin-right: 8px;
        }

        .keyword .remove {
            cursor: pointer;
            color: #dc3545;
            font-weight: bold;
            font-size: 12px;
        }

        #keyword-input {
            width: 150px;
            padding: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: white;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        input[type="reset"] {
            background-color: #6c757d;
            color: white;
        }

        input[type="reset"]:hover {
            background-color: #5a6268;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
            color: #333;
        }

        p {
            margin: 10px 0;
        }

        .description {
            text-align: left;
            color: #666;
            margin-bottom: 20px;
        }

        .supplementary {
            text-align: left;
            color: #ddd;
            margin-top: 5px;
            margin-bottom: 3px;
        }

        input[type="file"] {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .profile-section {
                flex-direction: column;
                align-items: center;
            }

            .profile-photo {
                width: 120px;
                height: 120px;
            }

            .profile-details {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>새로운 스터디 등록하기</h2>
        <p class="description">내게 딱맞는 스터디 그룹이 아직 없다면, 직접 만들어보는 건 어떨까요? 👀✨ </p>
        <hr>
        <br>
        <form id="study-form">
            <div class="profile-section">
                <div class="profile-photo">
                    <img id="profile-image" src="img/studygroup.jpg" alt="커버 사진">
                    <div class="upload-option" onclick="document.getElementById('profile-upload').click()">
                        사진 다시 업로드
                        <input type="file" id="profile-upload" name="profile-upload" accept="image/*"
                            onchange="previewImage(event)">
                    </div>
                </div>
                <div class="profile-details">
                    <p>
                        <label for="groupname">스터디 이름</label>
                    <p class="supplementary"> 쉽게 알아볼 수 있는 이름을 입력하면 다른 사용자가 찾기 편해요.</p>
                    <input type="text" id="groupname" name="groupname" placeholder="스터디 이름을 입력하세요" required>
                    </p>
                    <label for="category">스터디 카테고리</label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>== 스터디 카테고리 ==</option>
                        <option value="certificate">자격증</option>
                        <option value="language">외국어 공부</option>
                        <option value="hobby">취미</option>
                        <option value="major">전공 공부</option>
                    </select>

                    <label for="keyword-input">스터디 키워드</label>
                    <div>
                        <input type="text" id="keyword-input" placeholder="키워드를 입력 후 Enter"
                            onkeypress="addKeyword(event)">
                        <div id="keyword-container" class="keyword-container"></div>
                        <input type="hidden" id="keywords" name="keywords">
                    </div>
                </div>
            </div>

            <label for="summary">스터디 설명 📝 </label>
            <textarea id="summary" name="summary" placeholder="스터디의 목적과 간단한 설명을 작성해주세요." required></textarea>

            <label for="recruit">이런 스터디원을 구합니다! 🙌</label>
            <textarea id="recruit" name="recruit" placeholder="어떤 사람이 참여하면 좋을지, 특징을 작성해주세요." required></textarea>

            <p>
                <input type="submit" value="등록하기">
                <input type="reset" value="초기화">
            </p>
        </form>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function () {
                const output = document.getElementById('profile-image');
                output.src = reader.result;
                // 이미지 데이터를 localStorage에 저장
                localStorage.setItem('profileImage', reader.result);
            };
            reader.readAsDataURL(event.target.files[0]);
        }
        function addKeyword(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const input = document.getElementById('keyword-input');
                const keyword = input.value.trim();
                if (keyword) {
                    const container = document.getElementById('keyword-container');
                    const keywordDiv = document.createElement('div');
                    keywordDiv.className = 'keyword';
                    keywordDiv.innerHTML = `<span class="keyword-text"># ${keyword}</span><span class="remove" onclick="removeKeyword(this)">x</span>`;
                    container.appendChild(keywordDiv);
                    updateKeywords();
                    input.value = '';
                }
            }
        }

        function removeKeyword(element) {
            const keywordDiv = element.parentElement;
            keywordDiv.remove();
            updateKeywords();
        }

        function updateKeywords() {
            const keywords = Array.from(document.querySelectorAll('.keyword .keyword-text'))
                .map(span => span.textContent.replace('#', '').trim())
                .filter(keyword => keyword)
                .join(',');
            document.getElementById('keywords').value = keywords;
            console.log('Keywords updated:', keywords); // 디버깅용 로그
        }
        document.getElementById('study-form').addEventListener('submit', function (e) {
            e.preventDefault(); // 기본 폼 제출 동작 방지
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);

            // 데이터가 비어 있는지 확인
            if (!data.groupname || !data.category || !data.summary || !data.recruit) {
                alert('모든 필드를 채워주세요!');
                return;
            }

            // localStorage에 저장
            localStorage.setItem('studyData', JSON.stringify(data));
            alert('스터디 정보가 로컬에 저장되었습니다! "등록된 스터디 보기" 링크를 클릭하여 확인하세요.');
        });
    </script>
</body>

</html>
