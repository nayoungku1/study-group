<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스터디 그룹 플랫폼</title>
  <link rel="stylesheet" href="mainpage.css">
</head>

<body>
  <div class="sidebar">
    <h3>메뉴</h3>
    <ul>
      <li><a href="mainpage.html">홈</a></li>
      <li><a href="view_study.html">전체 스터디</a></li>
      <li><a href="register.html">등록하기</a></li>
      <li><a href="mypage.html">마이페이지</a></li>
      <li><a href="acceptdecline.html">신청 수락/거절</a></li>
    </ul>
  </div>

  <div class="main">
    <div class="topbar">
      <div style="display: flex; flex-direction: column;">
        <strong>스터디 찾기</strong>
        <button id="sidebar-toggle" class="sidebar-toggle-btn">≡ 메뉴 열기</button>
      </div>
      <div class="right">
        <div class="search-box">
          <input type="text" placeholder="스터디를 검색하세요..." />
          <span class="search-icon">🔍</span>
        </div>
        <button class="bell-icon" id="notification-btn">🔔<span id="notification-badge"></span></button>
        <a href="login.html"><button class="login-btn">로그인/회원가입</button></a>
      </div>
    </div>

    <div class="category-bar">
      <div class="category-item active">전체</div>
      <div class="category-item">개발</div>
      <div class="category-item">디자인</div>
      <div class="category-item">외국어</div>
      <div class="category-item">취업준비</div>
      <div class="category-item">자격증</div>
      <div class="category-item">공모전</div>
      <div class="category-item">기타</div>
    </div>

    <div class="content">
      <!-- 카드 1 -->
      <div class="study-card">
        <div class="study-card-header">스터디 제목</div>
    
        <div class="study-card-body">
          <div>이 스터디는 디자인을 공부하는 사람을 위한...</div>
          <div class="study-save">♡</div>
        </div>

        <div class="study-card-footer">
          <!-- 왼쪽 영역: 일정 + 태그 -->
           <div class="left-info">
            <div class="study-info">
              <span class="calendar-icon">📅</span> 수·목 18:00
              <span class="divider">|</span>
              <span class="people-icon">👥</span> 4/7 명
            </div>
            <div class="study-tags">
              <span class="study-tag">테그1</span>
              <span class="study-tag">테그2</span>
              <span class="study-tag">테그3</span>
            </div>
          </div>

          <!-- 오른쪽 영역: 남은 인원 -->
           <div class="study-people">3명 남음</div>
        </div>
      </div>
    </div>

  <div id="notification-modal">
    <div>알림</div>
    <div>스터디원 요청이 도착했습니다.</div>
    <button id="accept-btn">수락</button>
    <button id="reject-btn">거절</button>
  </div>

  <script>
    // 페이지 로드 시 새 알림이 있다고 가정(뱃지 표시)
    document.getElementById('notification-badge').style.display = 'inline-block';

    document.getElementById('notification-btn').onclick = function() {
      document.getElementById('notification-modal').innerHTML = `
        <div>알림</div>
        <div>스터디원 요청이 도착했습니다.</div>
        <button id="accept-btn">수락</button>
        <button id="reject-btn">거절</button>
      `;
      document.getElementById('notification-modal').style.display = 'block';
      // 알림 확인시 뱃지 숨김
      document.getElementById('notification-badge').style.display = 'none';

      document.getElementById('accept-btn').onclick = function(){
        document.getElementById('notification-modal').innerHTML = `
          <div>스터디원 요청을 <b style="color:green;">수락</b>했습니다!</div>
          <button id="close-btn">닫기</button>
        `;
        document.getElementById('close-btn').onclick = function() {
          document.getElementById('notification-modal').style.display = 'none';
        }
      }
      document.getElementById('reject-btn').onclick = function(){
        document.getElementById('notification-modal').innerHTML = `
          <div>스터디원 요청을 <b style="color:red;">거절</b>했습니다.</div>
          <button id="close-btn">닫기</button>
        `;
        document.getElementById('close-btn').onclick = function() {
          document.getElementById('notification-modal').style.display = 'none';
        }
      }
    };

    window.addEventListener('mousedown', function(e){
      let modal = document.getElementById('notification-modal');
      let btn = document.getElementById('notification-btn');
      if(modal.style.display==="block" && !modal.contains(e.target) && e.target !== btn){
        modal.style.display = "none";
      }
    });
  </script>
  
  <script>
    const categoryItems = document.querySelectorAll('.category-item');

    categoryItems.forEach(item => {
      item.addEventListener('click', () => {
        // 기존 선택된 항목에서 active 제거
        categoryItems.forEach(i => i.classList.remove('active'));
        // 클릭된 항목에 active 추가
        item.classList.add('active');
      });
    });
  </script>

  <script>
  const sidebar = document.querySelector('.sidebar');
  const toggleBtn = document.getElementById('sidebar-toggle');

  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('active');
  });

  // 선택사항: 바깥 클릭 시 sidebar 닫기
  window.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && e.target !== toggleBtn) {
      sidebar.classList.remove('active');
    }
  });
</script>

</body>
</html>
