<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }
    .login-container {
      background-color: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 300px;
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-container input {
      width: 90%;
      padding: 10px;
      margin: 10px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .login-container button {
      width: 100%;
      padding: 10px;
      background-color: #e0e0e0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .login-container button:hover {
      background-color: #d0d0d0;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>로그인</h2>
    <form id="login-form" onsubmit="handleLogin(event)">
      <input type="email" id="email" placeholder="이메일" required>
      <input type="password" id="password" placeholder="비밀번호" required>
      <button type="submit">로그인</button>
    </form>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // 간단한 로그인 처리 (실제로는 서버와 연동 필요)
      if (email && password) {
        // 로컬 스토리지에 사용자 프로필 저장 (비밀번호는 보안상 제외)
        const userProfile = {
          name: email.split('@')[0], // 임시 이름 (실제로는 가입 데이터 사용)
          email: email,
          phone: '' // 로그인 시 초기값은 빈 문자열
        };
        localStorage.setItem('userProfile', JSON.stringify(userProfile));
        alert(`로그인 성공!\n이메일: ${email}\n다음에 마이페이지로 이동됩니다.`);
        // 실제로는 페이지 이동 로직 추가 (예: window.location.href = 'mypage.html';)
      } else {
        alert('이메일과 비밀번호를 입력해주세요.');
      }
    }
  </script>
</body>
</html>
