<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    .container {
      background-color: white;
      border-top: 15px solid #C7CDF8;
      padding: 50px;
      border-radius: 1dvh;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 95%;
      padding: 10px;
      margin: 10px 10px;
      background-color: #e0e0e0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #d0d0d0;
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="main.html"><img class="logo" src="logo/Studium logo4.png"></a>
    <h2>로그인</h2>
    <form id="login-form">
      <label for="username"></label>
      <input type="text" id="username" name="username" placeholder="ID" required />
      <br>
      <input type="password" id="password" name="password" placeholder="Password" required />
      <br>
      <button type="submit">로그인</button>
    </form>
    <p>계정이 없으신가요? <a href="sign-in.html">회원가입</a></p>
  </div>
</body>

<script>
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    const users = JSON.parse(localStorage.getItem('userList') || '[]');
    const found = users.find(user => user.username === username && user.password === password);

    if (!found) {
      alert('아이디 또는 비밀번호가 일치하지 않습니다.');
      return;
    }

    localStorage.setItem('currentUser', username);  // ✅ 로그인 상태 저장
    alert(`${found.name}님 환영합니다!`);
    window.location.href = 'main.html';  // 또는 mypage.html
  });
</script>

</html>
